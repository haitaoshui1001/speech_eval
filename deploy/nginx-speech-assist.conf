# 由 deploy/install.sh 渲染（替换 __APPDIR__ / __PORT__ / __LISTEN__ / __BODY_MB__）
# 后写入 /etc/nginx/conf.d/speech-assist.conf
#
# 三件事必须做对，其余都有默认值可用：
#   1) client_max_body_size 必须 ≥ .env 的 MAX_VIDEO_MB，否则 nginx 的默认 1MB
#      会抢在应用之前返回 413，用户看到的是"传不上去"而应用日志里什么都没有。
#   2) proxy_read_timeout 要盖过 .env 的 REQUEST_TIMEOUT（180s），否则长请求被代理掐断。
#   3) 关 buffering：视频回看是应用自己带 Range 流式吐的（app/main.py 的 _stream），
#      3Mbps 出口下再让 nginx 落盘缓冲一遍纯属浪费；上传同理，直接透传给应用流式写盘。
#
# 注意：/videos/{id}/play 与 /videos/{id}/asset/ 都受会话保护，**不能**交给 nginx 直出，
# 只有 /static 可以。

upstream speech_assist {
    server 127.0.0.1:__PORT__ fail_timeout=5s max_fails=3;
    keepalive 16;
}

server {
    listen __LISTEN__;
    server_name _;

    access_log /var/log/nginx/speech-assist.access.log combined;
    error_log  /var/log/nginx/speech-assist.error.log warn;

    client_max_body_size __BODY_MB__m;
    client_body_timeout  300s;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # 静态资源由 nginx 直出，省掉应用的同步线程。
    location /static/ {
        alias __APPDIR__/app/static/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 健康检查含模型名与 token 用量，只对服务器本机开放。
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://speech_assist;
        access_log off;
    }

    location / {
        proxy_pass http://speech_assist;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_body_buffer_size 64k;
    }
}
