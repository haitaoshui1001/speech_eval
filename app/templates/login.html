{% extends "base.html" %}
{% block title %}登录 · 演讲辅助评估系统{% endblock %}
{% block body %}
<div class="sheet" style="max-width:520px" data-reveal="1">
  <div class="kicker">Sign in</div>
  <h1 style="font-size:30px;margin-bottom:6px">登录</h1>
  <p class="lede" style="font-size:16px">口令仅以加盐哈希保存在本地 SQLite 中。</p>

  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  {% if notice %}<div class="alert info">{{ notice }}</div>{% endif %}

  <form class="stack" method="post" action="/login">
    <input type="hidden" name="next" value="{{ nxt }}">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username"
             value="{{ (form or {}).get('username', '') }}">
    </div>
    <div class="field">
      <label for="password">口令</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <div class="row-actions">
      <button class="btn" type="submit">进入</button>
      <a class="btn ghost" href="/guide">评分标准说明</a>
    </div>
  </form>

  <p class="dim-text" style="margin-top:14px">
    本系统不开放自助注册。账号与初始口令由管理员在后台开通（支持 Excel 批量导入），
    忘记口令也找管理员重置。
  </p>
</div>
{% endblock %}
